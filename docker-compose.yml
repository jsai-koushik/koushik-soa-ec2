
services:

  # 1. MySQL Database
  mysql-db:
    image: mysql:8.0
    container_name: marketplace-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15

  # 2. Eureka Server
  eureka-server:
    build:
      context: ./Eureka-Server
      dockerfile: Dockerfile
    container_name: marketplace-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"

  # 3. User Service
  user-service:
    build:
      context: ./UserService
      dockerfile: Dockerfile
    container_name: marketplace-user
    restart: unless-stopped
    environment:
      SERVER_PORT: 8001
      DB_HOST: mysql-db
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8001:8001"
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started

  # 4. Product Service
  product-service:
    build:
      context: ./ProductService
      dockerfile: Dockerfile
    container_name: marketplace-product
    restart: unless-stopped
    environment:
      SERVER_PORT: 8004
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/productdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8004:8004"
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started

  # 5. Order Service
  order-service:
    build:
      context: ./OrderService
      dockerfile: Dockerfile
    container_name: marketplace-order
    restart: unless-stopped
    environment:
      SERVER_PORT: 8003
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/orderdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8003:8003"
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started

  # 6. API Gateway
  api-gateway:
    build:
      context: ./APIGateway
      dockerfile: Dockerfile
    container_name: marketplace-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8000
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

      SPRING_CLOUD_GATEWAY_SERVER_WEBMVC_ROUTES_0_ID: user-service
      SPRING_CLOUD_GATEWAY_SERVER_WEBMVC_ROUTES_0_URI: http://user-service:8001
      SPRING_CLOUD_GATEWAY_SERVER_WEBMVC_ROUTES_0_PREDICATES_0: Path=/user/**

      SPRING_CLOUD_GATEWAY_SERVER_WEBMVC_ROUTES_1_ID: product-service
      SPRING_CLOUD_GATEWAY_SERVER_WEBMVC_ROUTES_1_URI: http://product-service:8004
      SPRING_CLOUD_GATEWAY_SERVER_WEBMVC_ROUTES_1_PREDICATES_0: Path=/product/**

      SPRING_CLOUD_GATEWAY_SERVER_WEBMVC_ROUTES_2_ID: order-service
      SPRING_CLOUD_GATEWAY_SERVER_WEBMVC_ROUTES_2_URI: http://order-service:8003
      SPRING_CLOUD_GATEWAY_SERVER_WEBMVC_ROUTES_2_PREDICATES_0: Path=/order/**

    ports:
      - "8000:8000"
    depends_on:
      - eureka-server
      - user-service
      - product-service
      - order-service

volumes:
  mysql_data:
