spring.application.name=ProductService
server.port=8002

#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/productdb
spring.datasource.username=root
spring.datasource.password=koushik@9

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Eureka Configuration
eureka.instance.appname=product-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

# Recommended Stability Additions:
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}

# ==========================================
# Resilience4j Circuit Breaker Configuration
# ==========================================

# Enable circuit breaker actuator health indicators (optional, but great for monitoring)
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents

# Circuit Breaker Instances Configurations
resilience4j.circuitbreaker.instances.productServiceCB.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.productServiceCB.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.productServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.productServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.productServiceCB.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.productServiceCB.slowCallDurationThreshold=2s
resilience4j.circuitbreaker.instances.productServiceCB.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.productServiceCB.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.productServiceCB.automaticTransitionFromOpenToHalfOpenEnabled=true

# Resilience4j Retry Configuration (Optional companion to Circuit Breaker)
resilience4j.retry.instances.productServiceRetry.maxAttempts=3
resilience4j.retry.instances.productServiceRetry.waitDuration=2s